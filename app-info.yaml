schemaVersion: "1.0"
releaseStage: "prelaunch"
name: "OfflineSignage"
category: "Android digital signage software"

description:
  short: "Local-first digital signage for Android advertising players."
  full: "OfflineSignage turns Android advertising players into reliable digital signs that can play local media and be controlled from a browser on the same network."
  valueProposition: "Keep signage simple, local, and reliable without a cloud account."

targetUsers:
  - "Small businesses running in-store displays"
  - "Schools, events, and offices with Android advertising players"
  - "Teams reusing Android TVs, tablets, and older phones as screens"
useCases:
  - "Storefront and menu boards"
  - "Reception, lobby, and event displays"
  - "Local network signage across multiple screens"

plannedCapabilities:
  - id: "local-media-playback"
    name: "Local media playback"
    description: "Play images, videos, web content, and playlists directly on the Android signage device."
  - id: "browser-control"
    name: "Browser control on the local network"
    description: "Manage playback from a browser without a mandatory cloud account or remote service."
  - id: "reliable-recovery"
    name: "Reliable playback and recovery"
    description: "Keep the screen awake, resume after reboot, and continue from locally cached resources."
  - id: "multi-device-sync"
    name: "Multi-device discovery and sync"
    description: "Discover nearby signage players and synchronize resources and playlists across screens."
  - id: "signage-ready-display"
    name: "Signage-ready display modes"
    description: "Use fullscreen playback, orientation control, volume and mute settings, and a focused kiosk workflow."

brand:
  productName: "OfflineSignage"
  tagline: "Digital signage that stays local."
  voice:
    - "Practical"
    - "Reliable"
    - "Clear"
  colors:
    - "#0f766e"
    - "#f4b942"
    - "#f7f4ed"

