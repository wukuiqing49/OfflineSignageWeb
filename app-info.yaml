schemaVersion: '1.0'
releaseStage: prelaunch
name: OfflineSignage
category: Android digital signage software & digital menu board
description:
  short: Local-first digital signage player and digital menu board for Android TVs,
    tablets, and commercial displays.
  full: OfflineSignage turns Android advertising players, smart TVs, tablets, and
    TV boxes into reliable digital signage displays and digital menu boards. Play
    images, video loops, and menus with browser control over the local network—no
    cloud accounts or recurring fees required.
  valueProposition: Keep signage simple, local, and reliable without cloud subscriptions
    or accounts.
targetUsers:
- Restaurants, cafes, and food courts running digital menu boards
- Retail stores and small businesses displaying in-store promotions and ads
- Offices, reception lobbies, clinics, and schools showing local announcements
- Teams repurposing Android TVs, TV boxes, tablets, and older phones as screens
useCases:
- Digital menu boards for restaurants, cafes, and bars
- Retail storefront advertising and dynamic window signage
- Reception, lobby, clinic, and event announcement displays
- Local network multi-screen synchronized signage playback
plannedCapabilities:
- id: local-media-playback
  name: Local media playback & digital menu boards
  description: Play high-resolution images, video loops, web pages, and custom playlists
    directly on the Android signage player.
- id: browser-control
  name: Local network browser control
  description: Manage playlists, media uploads, and playback schedules from any phone
    or PC browser on the same Wi-Fi/LAN without cloud accounts.
- id: reliable-recovery
  name: Kiosk mode & auto boot recovery
  description: Keep the screen awake 24/7, start automatically on device boot, and
    recover playback seamlessly after power interruptions.
- id: multi-device-sync
  name: Multi-device discovery & sync
  description: Automatically discover nearby signage players on the local network
    and synchronize media files and playlists across screens.
- id: signage-ready-display
  name: Signage-ready display modes
  description: Support landscape and portrait orientation, fullscreen playback, volume
    and mute controls, and background blur for non-standard aspect ratios.
