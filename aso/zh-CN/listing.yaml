title: OfflineSignage 广告机与电子餐牌
shortDescription: 本地化 Android 广告机与电子餐牌播放器，局域网浏览器一键控制免云端月费
fullDescription: '将任何 Android 广告机、智能电视 (Android TV)、电视盒子或平板电脑秒变专业商业数字标牌与电子餐牌播放器。


  OfflineSignage 采用本地优先（Local-First）架构，无需注册云端账号，无隐性按月订阅费用，让商业展示更稳定、更简单、更安全。


  核心功能特性：

  - 高清多媒体播放：流畅轮播 4K 超清视频、高清海报图片、电子餐牌及自定义网页组件。

  - 局域网 Web 控制台：手机或电脑连接同一 Wi-Fi，扫码或输入局域网 IP 即可管理排期与上传素材。

  - 商业保活与开机自愈：屏幕持续常亮防休眠，支持开机自启并在异常断电重启后自动恢复播放。

  - 局域网多屏同步：自动发现局域网内的其它广告机，一键同步分发素材与播放列表。

  - 横竖屏适配：支持横屏与竖屏模式自由切换，自带非标比例背景智能虚化与静音控制。


  适用场景：

  - 餐饮门店、咖啡厅、茶饮店电子餐牌 (Digital Menu Board)

  - 零售商超、服装专卖店橱窗广告屏

  - 企业大堂、前台接待、会议室信息公告

  - 医院、诊所、政务大厅与学校展播


  立即体验无需外网、开箱即用的本地化专业广告机系统！'
