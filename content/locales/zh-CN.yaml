home:
  pageTitle: OfflineSignage - Android 广告机与电子餐牌播放器 (Local Digital Signage & Menu Board)
  metaDescription: OfflineSignage 是面向 Android 电视、平板与广告机的本地优先数字标牌系统（Digital Signage
    Player & Digital Menu Board）。无需云端账号，局域网浏览器一键管理图片、视频与电子餐牌。
  category: Android 广告机与电子餐牌软件
  tagline: 让数字标牌与电子餐牌保持本地、简单、可靠。
  shortDescription: 把 Android 广告机、智能电视、平板和旧手机变成长期稳定运行的数字广告屏与电子餐牌。
  fullDescription: OfflineSignage 将 Android 设备变为专业的数字标牌播放器（Digital Signage Player）。设备内置轻量服务、本地存储与高清播放引擎，通过同一局域网内的浏览器即可轻松控制，无需云端订阅与复杂配置。
  heroScreenshotAlt: OfflineSignage Android 广告机与电子餐牌产品主视觉
  heroScreenshotCaption: 本地优先、零云端依赖的 Android 广告机与电子餐牌播放系统。
  overviewHeading: 为 24/7 持续运行的显示屏而生
  overviewIntro: 从高清本地媒体播放、多屏同步到局域网浏览器秒级控制，每个模块都围绕稳定、清晰、可自愈的商业标牌体验打造。
  featuresHeading: 核心功能与规划
  featuresIntro: 坚持 Local-first、Offline-first，无云端账号绑定，零隐性订阅费用。
  features:
    local-media-playback:
      name: 本地多媒体与电子餐牌播放
      description: 在设备本地直接播放 4K 图片、循环视频、HTML 网页与自定义轮播列表。
    browser-control:
      name: 局域网浏览器轻松控制
      description: 手机或电脑连入同一 Wi-Fi，打开浏览器即可上传素材、调整排期与即时控制。
    reliable-recovery:
      name: 商用保活与断电开机自愈
      description: 屏幕持续常亮，支持开机自动启动并在异常重启后立即恢复上次播放状态。
    multi-device-sync:
      name: 局域网多设备发现与多屏同步
      description: 自动发现局域网内的其它广告机，一键分发与同步媒体资源与播放列表。
    signage-ready-display:
      name: 横竖屏适配与商用展示模式
      description: 支持横屏/竖屏自由切换、全屏沉浸播放、独立音量与静音控制，以及非标比例背景虚化。
  screenshotsHeading: 真实场景与播放界面
  screenshotsIntro: 适用于各类商业广告机、智能电视 (Android TV)、电视盒子、平板电脑及闲置旧手机。
  scenarios:
  - 餐饮与咖啡厅电子餐牌 (Digital Menu Boards)
  - 零售门店橱窗与促销大屏 (In-Store Signage)
  - 前台接待、诊所公告与多屏同步 (Lobby Displays)
  workflowHeading: 工作方式
  workflowIntro: 安装应用、连接网络、上传媒体、立即播放；关闭浏览器后广告机持续独立运行。
  workflowSteps:
  - 安装 OfflineSignage 到 Android 广告机或智能电视
  - 手机/电脑通过局域网 IP 或扫码进入 Web 管理控制台
  - 上传图片、视频或电子餐牌素材并配置播放列表
  - 开启全屏播放，关闭管理页面后广告机依然独立稳定播放
  closingHeading: 体验本地化数字标牌的强大与自由
  closingCopy: 告别繁重的云端平台与持续订阅，立即打造属于您的独立数字标牌网络。
privacy:
  pageTitle: 隐私政策 - OfflineSignage
  metaDescription: OfflineSignage 隐私政策与数据安全承诺。
  heading: 隐私政策
  lastUpdatedLabel: 最后更新
  content:
  - heading: 本地优先与隐私保护
    paragraphs:
    - OfflineSignage 采用 Local-first（本地优先）设计架构。您的图片、视频素材及播放配置仅存储在您的 Android 设备及局域网内部，不会上传到任何外部第三方云端服务器。
support:
  pageTitle: 技术支持与服务 - OfflineSignage
  metaDescription: OfflineSignage 技术支持、常见问题解答与联系方式。
  heading: 技术支持
  intro: 如果您在部署 Android 广告机、配置局域网控制或电子餐牌播放中有任何疑问，我们随时为您提供支持。
  faqHeading: 常见问题
  faq:
  - question: OfflineSignage 需要连接外网或注册云端账号吗？
    answer: 不需要。OfflineSignage 纯本地运行，只需要设备处于同一局域网（Wi-Fi 或有线网络）即可通过浏览器管理，无外网亦可全功能播放。
  - question: 支持哪些 Android 设备？
    answer: 支持 Android 广告机、Android TV 智能电视、电视盒子、Android 平板以及闲置的 Android 手机。
  contactHeading: 联系开发团队
  contactCopy: 如有定制需求、商业合作或问题反馈，欢迎发送邮件与我们取得联系。
  contactCta: 发送邮件咨询
