home:
  pageTitle: "OfflineSignage - Android 广告机系统"
  metaDescription: "OfflineSignage 是面向 Android 广告机的本地优先数字标牌系统。无需云端和账号，通过局域网浏览器控制播放。"
  category: "Android 广告机软件"
  tagline: "让广告机保持本地、简单、可靠。"
  shortDescription: "把 Android 广告机、电视、平板和旧手机变成可长期运行的数字广告屏。"
  fullDescription: "OfflineSignage 将 Android 设备变成数字广告屏，设备自己负责本地服务器、资源存储和播放，浏览器通过局域网进行控制。"
  heroScreenshotAlt: "OfflineSignage Android 广告机产品主视觉"
  heroScreenshotCaption: "产品正在开发中，首个版本聚焦于稳定的 Android 广告机本地播放。"
  overviewHeading: "为持续运行的广告机而设计"
  overviewIntro: "从本地播放到局域网控制，每个模块都围绕稳定、清晰、可恢复的广告机体验展开。"
  featuresHeading: "产品规划"
  featuresIntro: "坚持 Local-first、Offline-first、No Cloud、No Account。"
  features:
    local-media-playback:
      name: "本地媒体播放"
      description: "在广告机本地播放图片、视频、网页内容和播放列表。"
    browser-control:
      name: "局域网浏览器控制"
      description: "通过同一局域网中的浏览器控制广告机，不强制注册云端账号。"
    reliable-recovery:
      name: "稳定播放与自动恢复"
      description: "保持屏幕常亮，断电或重启后恢复服务和上次播放状态。"
    multi-device-sync:
      name: "多设备发现与同步"
      description: "自动发现附近广告机，同步资源和播放列表到各台设备。"
    signage-ready-display:
      name: "广告机显示模式"
      description: "提供全屏、横竖屏、音量、静音和适合长期运行的播放设置。"
  screenshotsHeading: "适用设备"
  screenshotsIntro: "优先面向 Android 广告机，也支持 Android 电视、电视盒子、平板和旧手机。"
  workflowHeading: "工作方式"
  workflowIntro: "安装、连接、上传、播放；关闭浏览器后广告机继续独立运行。"
  workflowSteps:
    - "安装 OfflineSignage 到 Android 广告机"
    - "通过二维码或局域网地址打开控制页面"
    - "上传图片、视频或添加网页并创建播放列表"
    - "关闭浏览器，广告机继续本地播放"
  closingHeading: "关注 OfflineSignage"
  closingCopy: "产品正在开发中，欢迎关注后续测试版本。"

